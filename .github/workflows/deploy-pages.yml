name: Deploy to GitHub Pages (gh-pages branch)

# Builds both games and publishes dist/ to the gh-pages branch, which GitHub
# Pages serves at https://roisa.github.io/moclock/ :
#   /          Baby Mo: Time Adventure
#   /racers/   Baby Mo: Time Racers (3D)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - name: Publish dist/ to gh-pages
        run: |
          cd dist
          rm -f icons/icon-1024.png
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
